name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate project
        run: node scripts/validate-project.mjs
      - name: Secret scan
        run: node scripts/scan-secrets.mjs
      - name: Run tests
        run: node --test
